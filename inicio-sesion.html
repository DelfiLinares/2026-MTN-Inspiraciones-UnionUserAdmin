<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión · InspiraBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { font-family: Manrope, Arial, sans-serif; color: #232323; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #565656; outline-offset: 3px; }
    .page { position: relative; width: min(100%, 1440px); min-height: 969px; margin: auto; overflow: hidden; background: #fff; }
    .form-column { position: absolute; z-index: 1; inset: 0 auto auto 120px; width: 446px; height: 969px; }
    h1 { position: absolute; top: 154px; left: 0; width: 430px; margin: 0; color: #222; font-size: 52px; font-weight: 700; line-height: 1.35; letter-spacing: 2px; }
    .field { position: absolute; left: 0; width: 446px; height: 54px; }
    .field--email { top: 321px; }
    .field--password { top: 433px; }
    .field input { display: block; width: 100%; height: 100%; padding: 0 20px; border: 1.5px solid #8b8b8b; border-radius: 10px; background: #fff; color: #222; font-size: 20px; }
    .field--email input { border: 2px solid #5c5c5c; }
    .field label { position: absolute; z-index: 1; top: -17px; left: 39px; padding: 0 6px; background: #fff; color: #8b8b8b; font-size: 23px; font-weight: 500; line-height: 29px; letter-spacing: .5px; pointer-events: none; }
    .field--email label { color: #8b8b8b; }
    .forgot { position: absolute; top: 510px; left: 120px; color: #8b8b8b; font-size: 16px; letter-spacing: .5px; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }
    .primary-button { position: absolute; top: 556px; left: 101px; display: grid; place-items: center; width: 244px; height: 71px; border: 1.2px solid #505050; border-radius: 18px; background: #aeaeae; color: #e9e9e9; font-size: 32px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
    .primary-button:hover, .primary-button:focus-visible { background: #999; color: #fff; }
    .divider { position: absolute; top: 651px; left: 19px; width: 407px; height: 1px; background: #d1d1d1; }
    .social { position: absolute; left: 19px; display: flex; align-items: center; width: 407px; height: 54px; padding: 0 19px; border: 1.5px solid #c9c9c9; border-radius: 10px; background: #fff; color: #5c5c5c; text-align: left; cursor: pointer; }
    .social:hover { background: #f5f5f5; }
    .social--google { top: 692px; }
    .social--github { top: 760px; }
    .social-icon { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; margin-right: 43px; color: #8b8b8b; }
    .google-icon { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; }
    .github-icon svg { display: block; width: 23px; height: 23px; fill: currentColor; }
    .social-label { font-size: 23px; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
    .circle-outline, .circle-fill { position: absolute; top: -86px; width: 1151px; height: 1151px; border-radius: 50%; pointer-events: none; }
    .circle-outline { left: calc(50% - 62px); border: 2px solid #d9d9d9; background: #fff; }
    .circle-fill { left: calc(50% - 40px); background: #ddd; }
    .promo { position: absolute; z-index: 1; inset: 0; pointer-events: none; }
    .promo h2 { position: absolute; top: 307px; left: calc(50% + 104px); margin: 0; color: #414141; font-size: 71px; font-weight: 700; line-height: 1.35; letter-spacing: 2px; white-space: nowrap; }
    .promo p { position: absolute; top: 454px; left: calc(50% + 184px); margin: 0; color: #666; font-size: 35px; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
    .promo a { position: absolute; top: 523px; left: calc(50% + 272px); display: grid; place-items: center; width: 223px; height: 79px; border: 4px solid rgba(125,125,125,.79); border-radius: 18px; background: #d0d0d0; color: rgba(255,255,255,.87); font-size: 32px; font-weight: 500; letter-spacing: 1px; text-decoration: none; pointer-events: auto; }
    .promo a:hover { background: #bdbdbd; color: #fff; }
    @media (max-width: 1100px) {
      .page { display: flex; flex-direction: column; gap: 40px; min-height: 100vh; padding: 64px 24px 40px; overflow: visible; }
      .form-column { position: relative; inset: auto; width: min(100%, 446px); height: auto; margin: auto; }
      h1 { position: static; width: auto; margin-bottom: 44px; font-size: clamp(36px, 7vw, 52px); line-height: 1.15; }
      .field { position: relative; left: auto; width: 100%; margin-bottom: 54px; }
      .field--email, .field--password { top: auto; }
      .forgot { position: static; display: block; width: max-content; max-width: 100%; margin: -30px auto 24px; }
      .primary-button { position: static; width: min(244px, 100%); margin: 0 auto 24px; }
      .divider { position: static; width: calc(100% - 38px); margin: 0 auto 30px; }
      .social { position: static; width: calc(100% - 38px); margin: 0 auto 14px; }
      .promo { position: relative; inset: auto; display: grid; justify-items: center; align-content: center; gap: 14px; min-height: 285px; padding: 30px 16px; overflow: hidden; border: 2px solid #d9d9d9; border-radius: 36px; background: #ddd; text-align: center; }
      .circle-outline, .circle-fill { display: none; }
      .promo h2, .promo p, .promo a { position: static; white-space: normal; }
      .promo h2 { font-size: clamp(35px, 6vw, 60px); line-height: 1.1; }
      .promo p { font-size: clamp(21px, 4vw, 30px); }
      .promo a { height: 60px; padding: 0 20px; font-size: 25px; }
    }
    @media (max-width: 520px) {
      .page { padding: 40px 16px 24px; }
      .field label { font-size: 19px; }
      .social { width: 100%; padding: 0 12px; }
      .social-icon { margin-right: 18px; }
      .social-label { font-size: clamp(15px, 4.5vw, 20px); }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="circle-outline" aria-hidden="true"></div>
    <div class="circle-fill" aria-hidden="true"></div>
    <section class="form-column" aria-labelledby="titulo">
      <h1 id="titulo">Bienvenido de<br>vuelta</h1>
      <div class="field field--email"><label for="correo">Correo</label><input id="correo" type="email" autocomplete="email"></div>
      <div class="field field--password"><label for="contrasena">Contraseña</label><input id="contrasena" type="password" autocomplete="current-password"></div>
      <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>
      <button class="primary-button" type="button">Ingresar</button>
      <div class="divider" aria-hidden="true"></div>
      <button class="social social--google" type="button"><span class="social-icon google-icon" aria-hidden="true">G</span><span class="social-label">Continuar con Google</span></button>
      <button class="social social--github" type="button"><span class="social-icon github-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></span><span class="social-label">Continuar con GitHub</span></button>
    </section>
    <aside class="promo">
      <h2>Empezá a crear</h2>
      <p>¿Aún no te registraste?</p>
      <a href="registro.html">Registrate</a>
    </aside>
  </main>
</body>
</html>
