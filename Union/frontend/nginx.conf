server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API requests must not receive the SPA HTML when no backend is configured.
    location ~ ^/api(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
