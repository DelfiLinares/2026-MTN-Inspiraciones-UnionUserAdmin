openapi: 3.0.3
info:
  title: Inspiraciones Union — Frontend Perfil API (contrato consumido)
  version: 1.1.0
  description: |
    Contrato REST que el frontend de perfil (feature 004-inspiraciones-perfil) CONSUME.
    No se implementa backend en este speckit (Principios III y IV).
    Las rutas se alinean con los adaptadores HTTP ya existentes en
    `Union/frontend/src/services/` (perfilService, carpetaService, publicacionService)
    para evitar duplicar contratos. Las rutas nuevas se marcan con `x-nuevo: true`.
    Trazabilidad: spec.md (HU-01..HU-13), clarifications.md (A1..A10).
servers:
  - url: /api
    description: Proxy de Vite (vite.config.ts) hacia la API Java
tags:
  - name: Perfiles
  - name: Carpetas
  - name: Publicaciones
  - name: Seguimiento

paths:
  /auth/me:
    get:
      tags: [Perfiles]
      summary: Usuario autenticado (resuelve "perfil propio")
      description: HU-01. Se usa para decidir propio vs. ajeno y para la ruta `/perfil`.
      operationId: obtenerUsuarioActual
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /usuarios/{usuarioId}:
    get:
      tags: [Perfiles]
      summary: Obtener perfil (propio o ajeno)
      description: HU-01, HU-03. A10 — 404/403 si la cuenta está BANEADO o ELIMINADO.
      operationId: obtenerPerfil
      parameters: [ { $ref: '#/components/parameters/UsuarioId' } ]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilNoDisponible' }
        '404': { $ref: '#/components/responses/PerfilNoDisponible' }

  /perfil:
    patch:
      tags: [Perfiles]
      summary: Editar datos del perfil propio (sin foto)
      description: |
        HU-02. Solo el perfil del usuario autenticado (RF-38).
        A1 — 409 si el nombre de usuario ya existe. El cambio de nombre de usuario
        requiere confirmación previa en la interfaz (AC-02.6).
      operationId: actualizarPerfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarPerfilRequest' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /perfil/foto:
    post:
      tags: [Perfiles]
      x-nuevo: true
      summary: Cambiar foto de perfil propia
      description: HU-02, A2 — JPG/PNG/WebP, máximo 5 MB. Validación autoritativa en backend.
      operationId: cambiarFotoPerfil
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        '200':
          description: Foto actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '413': { $ref: '#/components/responses/ValidacionFallida' }
        '415': { $ref: '#/components/responses/ValidacionFallida' }

  /usuarios/{usuarioId}/seguir:
    post:
      tags: [Seguimiento]
      summary: Seguir a un usuario o administrador
      description: |
        HU-04, A4. El estado inicial del botón proviene de `Usuario.siguiendoPorUsuarioActual`.
        La interfaz aplica actualización optimista y revierte ante error (AC-04.4).
      operationId: seguirUsuario
      parameters: [ { $ref: '#/components/parameters/UsuarioId' } ]
      responses:
        '200':
          description: Estado de seguimiento resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoSeguimiento' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilNoDisponible' }
        '404': { $ref: '#/components/responses/PerfilNoDisponible' }
    delete:
      tags: [Seguimiento]
      summary: Dejar de seguir a un usuario
      description: HU-04, A4 (acción inversa del mismo botón).
      operationId: dejarDeSeguirUsuario
      parameters: [ { $ref: '#/components/parameters/UsuarioId' } ]
      responses:
        '200':
          description: Estado de seguimiento resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoSeguimiento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/PerfilNoDisponible' }

  /usuarios/{usuarioId}/carpetas:
    get:
      tags: [Carpetas]
      summary: Listar carpetas de un perfil (públicas, paginadas)
      description: HU-08, A6 (paginación server-side), A9 (sin privacidad). `total` permite aplicar el límite de 50.
      operationId: listarCarpetas
      parameters:
        - { $ref: '#/components/parameters/UsuarioId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Página de carpetas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaCarpetas' }
        '403': { $ref: '#/components/responses/PerfilNoDisponible' }
        '404': { $ref: '#/components/responses/PerfilNoDisponible' }

  /carpetas:
    post:
      tags: [Carpetas]
      summary: Crear carpeta propia
      description: |
        HU-05, HU-09 (creación dentro del flujo de guardar). A3 — nombre único por usuario.
        Límite de 50 carpetas (RF-22): 409 con `codigo = LIMITE_CARPETAS_ALCANZADO`.
      operationId: crearCarpeta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NombreCarpetaRequest' }
      responses:
        '201':
          description: Carpeta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carpeta' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /carpetas/{carpetaId}:
    patch:
      tags: [Carpetas]
      summary: Renombrar carpeta propia
      description: HU-06, A3. Requiere confirmación previa en la interfaz (AC-06.2).
      operationId: renombrarCarpeta
      parameters: [ { $ref: '#/components/parameters/CarpetaId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NombreCarpetaRequest' }
      responses:
        '200':
          description: Carpeta renombrada (cantidad de posts sin cambios, AC-06.4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carpeta' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Carpetas]
      summary: Eliminar carpeta propia
      description: |
        HU-07, A7. Elimina la carpeta y sus asociaciones; las publicaciones originales
        NO se eliminan. Requiere confirmación con advertencia (AC-07.1..AC-07.3).
      operationId: eliminarCarpeta
      parameters: [ { $ref: '#/components/parameters/CarpetaId' } ]
      responses:
        '204': { description: Carpeta eliminada }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /carpetas/{carpetaId}/posts:
    get:
      tags: [Carpetas]
      x-nuevo: true
      summary: Listar publicaciones guardadas en una carpeta
      description: HU-10 (necesario para quitar un post desde el detalle de carpeta).
      operationId: listarPostsDeCarpeta
      parameters:
        - { $ref: '#/components/parameters/CarpetaId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Página de publicaciones guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPublicaciones' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Carpetas]
      summary: Guardar una publicación en una carpeta propia
      description: HU-09, A8 — idempotente (200 si ya estaba guardada, 201 si es nueva).
      operationId: guardarPostEnCarpeta
      parameters: [ { $ref: '#/components/parameters/CarpetaId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicacionId]
              properties:
                publicacionId: { type: string }
      responses:
        '200':
          description: Ya estaba guardada (idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoGuardado' }
        '201':
          description: Guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoGuardado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /carpetas/{carpetaId}/posts/{publicacionId}:
    delete:
      tags: [Carpetas]
      summary: Quitar una publicación de una carpeta propia
      description: HU-10. La publicación original NO se elimina de la plataforma (AC-10.1).
      operationId: quitarPostDeCarpeta
      parameters:
        - { $ref: '#/components/parameters/CarpetaId' }
        - { $ref: '#/components/parameters/PublicacionId' }
      responses:
        '204': { description: Asociación eliminada }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /usuarios/{usuarioId}/publicaciones:
    get:
      tags: [Publicaciones]
      x-nuevo: true
      summary: Listar publicaciones de un perfil (paginadas)
      description: HU-13.
      operationId: listarPublicacionesDePerfil
      parameters:
        - { $ref: '#/components/parameters/UsuarioId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Página de publicaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPublicaciones' }
        '403': { $ref: '#/components/responses/PerfilNoDisponible' }
        '404': { $ref: '#/components/responses/PerfilNoDisponible' }

  /publicaciones/{publicacionId}:
    patch:
      tags: [Publicaciones]
      x-nuevo: true
      summary: Editar texto de una publicación propia
      description: HU-11, A5 — solo `texto`; la imagen es inmutable. Requiere confirmación (AC-11.2).
      operationId: editarPublicacion
      parameters: [ { $ref: '#/components/parameters/PublicacionId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texto]
              properties:
                texto: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Publicación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/ValidacionFallida' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Publicaciones]
      x-nuevo: true
      summary: Eliminar una publicación propia
      description: HU-12. Requiere confirmación (AC-12.2). No existe operación de creación en este contrato (RF-33).
      operationId: eliminarPublicacion
      parameters: [ { $ref: '#/components/parameters/PublicacionId' } ]
      responses:
        '204': { description: Publicación eliminada }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema: { type: string }
    CarpetaId:
      name: carpetaId
      in: path
      required: true
      schema: { type: string }
    PublicacionId:
      name: publicacionId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  schemas:
    RolUsuario:
      type: string
      enum: [USER, ADMIN]
    EstadoCuentaUsuario:
      type: string
      enum: [ACTIVO, BANEADO, ELIMINADO]

    Usuario:
      type: object
      required: [id, nombreUsuario, estado, rol]
      properties:
        id: { type: string }
        nombreUsuario:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_.]+$'
          description: A1 — único en la plataforma; sin espacios.
        fotoUrl: { type: string, format: uri, nullable: true }
        sobreMi: { type: string, maxLength: 80 }
        descripcion: { type: string, maxLength: 200 }
        estado: { $ref: '#/components/schemas/EstadoCuentaUsuario' }
        rol: { $ref: '#/components/schemas/RolUsuario' }
        siguiendoPorUsuarioActual:
          type: boolean
          description: Estado inicial del botón Seguir (A4). Ausente o false en el perfil propio.
        cantidadSeguidores: { type: integer, minimum: 0 }

    ActualizarPerfilRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombreUsuario:
          type: string
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9_.]+$'
        sobreMi: { type: string, maxLength: 80 }
        descripcion: { type: string, maxLength: 200 }

    Carpeta:
      type: object
      required: [id, propietarioId, nombre, cantidadPosts]
      properties:
        id: { type: string }
        propietarioId: { type: string }
        nombre: { type: string, minLength: 1, maxLength: 15 }
        cantidadPosts: { type: integer, minimum: 0 }

    NombreCarpetaRequest:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 15 }

    PaginaCarpetas:
      type: object
      required: [items, total, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Carpeta' }
        total: { type: integer, minimum: 0, maximum: 50 }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }

    Publicacion:
      type: object
      required: [id, autorId, imagenUrl, texto]
      properties:
        id: { type: string }
        autorId: { type: string }
        autorNombreUsuario: { type: string }
        autorFotoUrl: { type: string, nullable: true }
        imagenUrl: { type: string, format: uri, description: A5 — inmutable }
        texto: { type: string, maxLength: 2000 }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time, nullable: true }

    PaginaPublicaciones:
      type: object
      required: [items, total, limit, offset, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Publicacion' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }

    EstadoSeguimiento:
      type: object
      required: [usuarioId, siguiendo]
      properties:
        usuarioId: { type: string, description: Usuario seguido }
        siguiendo: { type: boolean }
        cantidadSeguidores: { type: integer, minimum: 0 }

    ResultadoGuardado:
      type: object
      required: [carpetaId, publicacionId, yaEstabaGuardado]
      properties:
        carpetaId: { type: string }
        publicacionId: { type: string }
        yaEstabaGuardado: { type: boolean }

    Error:
      type: object
      required: [mensaje, codigo]
      properties:
        mensaje: { type: string }
        codigo:
          type: string
          enum:
            - VALIDACION
            - NOMBRE_USUARIO_DUPLICADO
            - NOMBRE_CARPETA_DUPLICADO
            - LIMITE_CARPETAS_ALCANZADO
            - ARCHIVO_DEMASIADO_GRANDE
            - FORMATO_NO_SOPORTADO
            - PERFIL_NO_DISPONIBLE
            - NO_AUTORIZADO
            - NO_ENCONTRADO
        campo: { type: string, nullable: true }

  responses:
    ValidacionFallida:
      description: Validación fallida (400/413/415)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: 409 — NOMBRE_USUARIO_DUPLICADO, NOMBRE_CARPETA_DUPLICADO o LIMITE_CARPETAS_ALCANZADO
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutorizado:
      description: El recurso no pertenece al usuario autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PerfilNoDisponible:
      description: A10 — cuenta BANEADO/ELIMINADO o inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
