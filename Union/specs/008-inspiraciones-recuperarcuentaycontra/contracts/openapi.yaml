openapi: 3.0.0

info:
  title: "008 Recuperar cuenta y contraseña — Contrato requerido al backend"
  version: 1.0.0
  description: |
    Contrato que el backend (`2026-MTN-Inspiraciones-Api`) debe cumplir para que el
    frontend 008 funcione. NINGUNO de estos endpoints existe hoy (ver research.md).
    Este archivo no implementa nada; es el acuerdo de integración.
    Errores: formato existente `ErrorResponse { code, message, requestId }`.
    Rutas bajo `/api/auth/**` ya son públicas en SecurityConfig.

servers:
  - url: /api

paths:
  /auth/password-reset/request:
    post:
      summary: Solicita un código OTP por email (también sirve como reenvío)
      description: Responde 202 siempre que el formato sea válido, exista o no la cuenta (anti-enumeración).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudCodigo' }
      responses:
        '202': { description: Solicitud aceptada }
        '400': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

  /auth/password-reset/confirm:
    post:
      summary: Valida el OTP y establece la nueva contraseña
      description: |
        Éxito: cambia contraseña, consume el código, invalida JWT previos (password_changed_at)
        y audita PASSWORD_RESET_COMPLETED. No devuelve token (el usuario debe iniciar sesión).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmacionRestablecimiento' }
      responses:
        '204': { description: Contraseña actualizada }
        '400':
          description: Validación, OTP_INVALIDO, OTP_EXPIRADO u OTP_AGOTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

  /auth/login:
    post:
      summary: (Existente — cambio requerido G-06)
      description: |
        Si la contraseña es correcta y la cuenta está SUSPENDED debe responder 403 con
        code CUENTA_BANEADA. Credenciales inválidas, cuenta inexistente o DELETED siguen en 401.
      responses:
        '403':
          description: Cuenta suspendida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/appeals:
    post:
      summary: Envía una apelación de cuenta suspendida
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudApelacion' }
      responses:
        '201': { description: Apelación registrada }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { description: Credenciales inválidas }
        '403':
          description: CUENTA_NO_APELABLE (la cuenta no está suspendida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: APELACION_DUPLICADA (ya hay una PENDIENTE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: APELACION_RECHAZO_RECIENTE o límite de tasa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/apelaciones:
    get:
      summary: Lista apelaciones (solo ADMIN)
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoApelacion' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de apelaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaApelaciones' }
        '403': { description: Requiere rol ADMIN }

  /admin/apelaciones/{id}/aceptar:
    post:
      summary: Acepta la apelación y reactiva la cuenta (ACTIVE) (solo ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Apelación aceptada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apelacion' }
        '404': { description: No existe }
        '409': { description: Ya resuelta }

  /admin/apelaciones/{id}/rechazar:
    post:
      summary: Rechaza la apelación con motivo (solo ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Apelación rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apelacion' }
        '404': { description: No existe }
        '409': { description: Ya resuelta }

components:
  responses:
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DemasiadasSolicitudes:
      description: |
        Límite de tasa. Debe incluir `retryAfterSeconds` en el cuerpo (el `httpClient` del frontend
        no expone cabeceras); además puede enviar la cabecera Retry-After. Sin valor, el frontend usa 60 s.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    SolicitudCodigo:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
    ConfirmacionRestablecimiento:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        newPassword:
          type: string
          description: Mínimo 8 caracteres, con letra, número y carácter especial
    SolicitudApelacion:
      type: object
      required: [email, password, mensaje]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string }
        mensaje: { type: string, minLength: 20, maxLength: 1000 }
    EstadoApelacion:
      type: string
      enum: [PENDIENTE, ACEPTADA, RECHAZADA]
    Apelacion:
      type: object
      properties:
        id: { type: string }
        usuarioId: { type: string }
        username: { type: string }
        email: { type: string }
        mensaje: { type: string }
        estado: { $ref: '#/components/schemas/EstadoApelacion' }
        creadaEn: { type: string, format: date-time }
        resueltaEn: { type: string, format: date-time, nullable: true }
        motivoRechazo: { type: string, nullable: true }
    PaginaApelaciones:
      type: object
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Apelacion' }
        pagina: { type: integer }
        tamanio: { type: integer }
        totalElementos: { type: integer }
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: |
            VALIDATION_ERROR, OTP_INVALIDO, OTP_EXPIRADO, OTP_AGOTADO, DEMASIADAS_SOLICITUDES,
            CUENTA_BANEADA, CUENTA_NO_APELABLE, APELACION_DUPLICADA, APELACION_RECHAZO_RECIENTE
        message: { type: string }
        requestId: { type: string }
        retryAfterSeconds: { type: integer, description: Solo en 429 }
        intentosRestantes: { type: integer, description: Solo en OTP_INVALIDO (opcional) }
