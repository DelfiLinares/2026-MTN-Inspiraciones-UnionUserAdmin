openapi: 3.0.3
info:
  title: API REST - Frontend Administrativo (Usuarios, Publicaciones, Reportes)
  description: >
    Contrato de la API REST que será consumida por `frontend-admin` (React) en una iteración futura.
    Esta API será implementada por un backend Java externo a este speckit (Principio III de la
    constitución); este documento describe únicamente el contrato consumido, no la implementación
    del servidor. Trazabilidad con specs/002-frontend-admin/spec.md.
  version: "1.0.0"

servers:
  - url: /api/admin
    description: Prefijo base de todas las operaciones administrativas

tags:
  - name: Usuarios
    description: Gestión y promoción de usuarios (HU-01, HU-02, HU-03, RF-01..RF-08)
  - name: Publicaciones
    description: Gestión de publicaciones de cualquier usuario (HU-04, HU-05, RF-09..RF-12)
  - name: Reportes
    description: Revisión y exportación de reportes (HU-06..HU-09, RF-13..RF-20)

paths:
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Buscar/listar usuarios con paginación y filtros resueltos por la API (RF-05)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: texto
          schema: { type: string }
          description: Criterio de búsqueda (nombre/email).
        - in: query
          name: rol
          schema: { $ref: "#/components/schemas/RolUsuario" }
        - in: query
          name: estadoCuenta
          schema: { $ref: "#/components/schemas/EstadoCuentaUsuario" }
      responses:
        "200":
          description: Página de usuarios coincidentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaUsuarios"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /usuarios/{usuarioId}/banear:
    post:
      tags: [Usuarios]
      summary: >
        Banear a un usuario con rol USER (RF-01, RF-03). Requiere confirmación explícita en el
        cliente antes de invocar. Prohibido si el usuario objetivo tiene rol ADMIN.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanearUsuarioRequest"
      responses:
        "200":
          description: Usuario baneado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: >
            Conflicto: el usuario objetivo tiene rol ADMIN y no puede ser baneado (RF-03), o su
            estado ya cambió por otra operación concurrente (ver research.md §6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /usuarios/{usuarioId}/eliminar:
    post:
      tags: [Usuarios]
      summary: >
        Eliminar la cuenta de un usuario con rol USER (RF-02, RF-03). Requiere confirmación
        explícita en el cliente antes de invocar. Prohibido si el usuario objetivo tiene rol ADMIN.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Usuario eliminado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El usuario objetivo tiene rol ADMIN y no puede ser eliminado (RF-03).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /usuarios/{usuarioId}/promover:
    post:
      tags: [Usuarios]
      summary: >
        Promover a un usuario con rol USER al rol ADMIN (RF-06, RF-07, RF-08). Requiere confirmación
        explícita en el cliente. Solo invocable por un actor autenticado con rol ADMIN. Si el usuario
        objetivo ya tiene rol ADMIN, el frontend NO debe invocar este endpoint (no-op validado en
        cliente, RF-08); el backend igualmente debe rechazarlo como defensa adicional.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UsuarioId"
      responses:
        "200":
          description: Usuario promovido exitosamente a ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El usuario objetivo ya tiene rol ADMIN (operación inválida, RF-08).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /publicaciones:
    get:
      tags: [Publicaciones]
      summary: Listar publicaciones de cualquier usuario con paginación y filtros (RF-11)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: estado
          schema: { $ref: "#/components/schemas/EstadoPublicacion" }
        - in: query
          name: autorId
          schema: { type: string }
      responses:
        "200":
          description: Página de publicaciones coincidentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPublicaciones"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /publicaciones/{publicacionId}:
    put:
      tags: [Publicaciones]
      summary: >
        Editar el contenido de una publicación de cualquier usuario (RF-09). Requiere confirmación
        explícita en el cliente para guardar los cambios.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PublicacionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarPublicacionRequest"
      responses:
        "200":
          description: Publicación editada exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /publicaciones/{publicacionId}/eliminar:
    post:
      tags: [Publicaciones]
      summary: >
        Eliminar la publicación de cualquier usuario (RF-10, RF-12). Requiere confirmación explícita
        en el cliente antes de invocar. Cambia el estado a ELIMINADA sin distinguir el estado previo.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PublicacionId"
      responses:
        "200":
          description: Publicación eliminada exitosamente (estado ELIMINADA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes:
    get:
      tags: [Reportes]
      summary: Listar reportes con paginación y filtros por estado, prioridad y motivo (RF-13, RF-14)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: estadoModeracion
          schema: { $ref: "#/components/schemas/EstadoModeracion" }
        - in: query
          name: prioridad
          schema: { $ref: "#/components/schemas/PrioridadReporte" }
        - in: query
          name: motivo
          schema: { $ref: "#/components/schemas/MotivoReporte" }
      responses:
        "200":
          description: Página de reportes coincidentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaReportes"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /reportes/{reporteId}:
    get:
      tags: [Reportes]
      summary: Consultar el detalle de un reporte (RF-13)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReporteId"
      responses:
        "200":
          description: Detalle del reporte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{reporteId}/aceptar:
    post:
      tags: [Reportes]
      summary: >
        Aceptar un reporte en estado PENDIENTE o EN_REVISION (RF-15, RF-17), cambiando su estado de
        moderación a RESUELTO. No requiere confirmación explícita en el cliente cuando solo cambia
        el estado del reporte (resuelto, Clarifications Session 2026-10-05, AC-07.3); si el
        administrador además elimina la publicación asociada en el mismo flujo, esa acción adicional
        (PUT/POST sobre /publicaciones/{publicacionId}/eliminar) sí requiere su propia confirmación.
        No disponible si el reporte ya está en estado RESUELTO o DESESTIMADO. Este endpoint NO
        modifica el estado de la publicación asociada.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReporteId"
      responses:
        "200":
          description: Reporte aceptado (estado RESUELTO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El reporte ya está en un estado final (RESUELTO o DESESTIMADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reportes/{reporteId}/rechazar:
    post:
      tags: [Reportes]
      summary: >
        Rechazar un reporte en estado PENDIENTE o EN_REVISION (RF-16, RF-17), cambiando su estado de
        moderación a DESESTIMADO. Requiere confirmación explícita en el cliente (AC-08.3). Si la
        publicación asociada no tiene otros reportes en estado PENDIENTE o EN_REVISION, su estado
        (EstadoPublicacion) vuelve automáticamente a ACTIVA como efecto de esta operación (resuelto,
        Clarifications Session 2026-10-01, AC-08.6); si tiene otros reportes pendientes, permanece
        en REPORTADA. No disponible si el reporte ya está en estado RESUELTO o DESESTIMADO.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReporteId"
      responses:
        "200":
          description: >
            Reporte rechazado (estado DESESTIMADO). La publicación embebida en la respuesta refleja
            su EstadoPublicacion actualizado (posible reactivación automática a ACTIVA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El reporte ya está en un estado final (RESUELTO o DESESTIMADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reportes/exportar:
    post:
      tags: [Reportes]
      summary: >
        Exportar reportes respetando los filtros activos (RF-19, RF-20; HU-09). Operación síncrona:
        la respuesta entrega directamente el resultado disponible para descarga o un error (ver
        research.md §5). El formato exacto del archivo queda fuera de alcance de este contrato
        (urlDescarga tratada como opaca). En el frontend, este endpoint se invoca desde un botón
        "Exportar" integrado en la misma pantalla de listado de reportes (/reportes), no desde una
        pantalla o ruta separada (resuelto, Clarifications Session 2026-10-01).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiltroReportesRequest"
      responses:
        "200":
          description: Exportación generada exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoExportacionExitoso"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "500":
          description: >
            Error al generar el archivo de exportación. El frontend muestra el mensaje
            "Error: Reporte no generado." (alineado con HU-15 de 001-plataforma-unificada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de sesión de un usuario con rol ADMIN. La validación definitiva de rol/permiso es
        responsabilidad del backend (RNF-05 de spec.md); el frontend solo refleja dicho estado.

  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 0, default: 0 }
      description: Número de página (base 0), resuelto por la API.
    PageSize:
      in: query
      name: size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Tamaño de página, resuelto por la API.
    UsuarioId:
      in: path
      name: usuarioId
      required: true
      schema: { type: string }
    PublicacionId:
      in: path
      name: publicacionId
      required: true
      schema: { type: string }
    ReporteId:
      in: path
      name: reporteId
      required: true
      schema: { type: string }

  responses:
    NoAutenticado:
      description: No autenticado (token ausente o inválido).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SinPermiso:
      description: Autenticado pero sin rol ADMIN (RF-21).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: El recurso solicitado no existe (ver research.md §6).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SolicitudInvalida:
      description: Datos de la solicitud inválidos (validación de formato, campos requeridos).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RolUsuario:
      type: string
      enum: [USER, ADMIN]

    EstadoCuentaUsuario:
      type: string
      enum: [ACTIVO, BANEADO, ELIMINADO]

    EstadoPublicacion:
      type: string
      enum: [ACTIVA, REPORTADA, ELIMINADA]

    EstadoModeracion:
      type: string
      enum: [PENDIENTE, EN_REVISION, RESUELTO, DESESTIMADO]

    MotivoReporte:
      type: string
      enum: [SPAM, CONTENIDO_INAPROPIADO, PLAGIO_DERECHOS_AUTOR, VIOLENCIA, OTRO]

    PrioridadReporte:
      type: string
      enum: [ALTA, MEDIA, BAJA]

    Usuario:
      type: object
      required: [id, nombre, email, rol, estadoCuenta]
      properties:
        id: { type: string }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        estadoCuenta: { $ref: "#/components/schemas/EstadoCuentaUsuario" }
        fechaRegistro: { type: string, format: date-time }

    PaginaUsuarios:
      type: object
      required: [contenido, totalElementos, pagina, tamanioPagina]
      properties:
        contenido:
          type: array
          items: { $ref: "#/components/schemas/Usuario" }
        totalElementos: { type: integer }
        pagina: { type: integer }
        tamanioPagina: { type: integer }

    BanearUsuarioRequest:
      type: object
      required: [permanente]
      properties:
        permanente:
          type: boolean
          description: true si el baneo es permanente; false si es temporal (requiere fechaFin).
        fechaFin:
          type: string
          format: date-time
          description: Requerido cuando permanente = false (RF-01, AC-01.2).

    Publicacion:
      type: object
      required: [id, autorId, titulo, estado]
      properties:
        id: { type: string }
        autorId: { type: string }
        titulo: { type: string }
        descripcion: { type: string }
        estado: { $ref: "#/components/schemas/EstadoPublicacion" }
        fechaCreacion: { type: string, format: date-time }

    PaginaPublicaciones:
      type: object
      required: [contenido, totalElementos, pagina, tamanioPagina]
      properties:
        contenido:
          type: array
          items: { $ref: "#/components/schemas/Publicacion" }
        totalElementos: { type: integer }
        pagina: { type: integer }
        tamanioPagina: { type: integer }

    EditarPublicacionRequest:
      type: object
      properties:
        titulo: { type: string }
        descripcion: { type: string }

    Reporte:
      type: object
      required: [id, publicacionId, reportanteId, motivo, prioridad, estadoModeracion]
      properties:
        id: { type: string }
        publicacionId: { type: string }
        reportanteId: { type: string }
        motivo: { $ref: "#/components/schemas/MotivoReporte" }
        prioridad: { $ref: "#/components/schemas/PrioridadReporte" }
        estadoModeracion: { $ref: "#/components/schemas/EstadoModeracion" }
        fechaCreacion: { type: string, format: date-time }

    PaginaReportes:
      type: object
      required: [contenido, totalElementos, pagina, tamanioPagina]
      properties:
        contenido:
          type: array
          items: { $ref: "#/components/schemas/Reporte" }
        totalElementos: { type: integer }
        pagina: { type: integer }
        tamanioPagina: { type: integer }

    FiltroReportesRequest:
      type: object
      properties:
        estadoModeracion: { $ref: "#/components/schemas/EstadoModeracion" }
        prioridad: { $ref: "#/components/schemas/PrioridadReporte" }
        motivo: { $ref: "#/components/schemas/MotivoReporte" }

    ResultadoExportacionExitoso:
      type: object
      required: [urlDescarga]
      properties:
        urlDescarga:
          type: string
          description: URL opaca de descarga del archivo exportado (ver research.md §5).
        nombreArchivoSugerido:
          type: string

    Error:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string }
        codigo: { type: string }
