openapi: 3.0.0

info:
  title: "006 Cuestionario de Intereses — Contrato Frontend"
  version: 1.0.0
  description: |
    Contrato y esquema de datos para el módulo de Cuestionario de Intereses.
    
    Este archivo define:
    - DTOs (Data Transfer Objects) esperados en futuras iteraciones.
    - Estructura de preferencias que se pasan al módulo de feed.
    - Opciones de integración con API REST Java (futura).
    
    **Nota**: El cuestionario en MVP es 100% frontend sin backend.
    Este contrato prepara las interfaces para integración futura.

paths: {}

components:
  schemas:
    # Enums
    CategoriaInteres:
      type: string
      enum:
        - dibujo
        - escultura
        - fotografia
        - literatura
        - escultura_digital
        - pintura_digital
        - instalacion
        - performance
        - video_arte
      description: |
        Categorías de intereses artísticos generales.
        Debe sincronizarse con módulo 002 (publicaciones).

    GeneroMusical:
      type: string
      enum:
        - rock
        - pop
        - electronica
        - metal
        - k_pop
        - country
        - nacional
        - reggaeton
        - hip_hop
        - clasica
        - r_and_b
        - blues
      description: |
        Géneros musicales.
        Debe sincronizarse con módulo 002 (publicaciones).

    EstiloPintura:
      type: string
      enum:
        - realismo
        - abstraccion
        - impresionismo
        - surrealismo
        - expresionismo
        - cubismo
      description: |
        Estilos, técnicas o categorías de pintura.
        Debe sincronizarse con módulo 002 (publicaciones).

    # Value Objects del Dominio
    OpcionRespuesta:
      type: object
      required:
        - id
        - categoria
        - descripcion
      properties:
        id:
          type: string
          description: Identificador único de la opción.
          example: "dibujo_1"
        categoria:
          oneOf:
            - $ref: "#/components/schemas/CategoriaInteres"
            - $ref: "#/components/schemas/GeneroMusical"
            - $ref: "#/components/schemas/EstiloPintura"
          description: Categoría a la que pertenece la opción.
        descripcion:
          type: string
          description: Texto legible para el usuario.
          example: "Dibujo a lápiz, digital, etc."

    Pregunta:
      type: object
      required:
        - id
        - texto
        - opciones
        - permiteMultipleSelecciones
        - obligatoria
      properties:
        id:
          type: string
          description: Identificador único de la pregunta.
          example: "artistica"
        texto:
          type: string
          description: Enunciado de la pregunta.
          example: "¿Cuáles son tus intereses artísticos?"
        opciones:
          type: array
          items:
            $ref: "#/components/schemas/OpcionRespuesta"
          description: Lista de opciones de respuesta.
        permiteMultipleSelecciones:
          type: boolean
          description: Si true, se puede seleccionar más de una opción.
          default: true
        obligatoria:
          type: boolean
          description: Si true, al menos una opción debe ser seleccionada para continuar.
          default: true

    # Respuestas del usuario
    RespuestaCuestionario:
      type: object
      description: |
        Mapa de respuestas: { idPregunta -> [ids de opciones seleccionadas] }
      example:
        artistica: ["dibujo_1", "escultura_1"]
        musical: ["rock", "pop"]
        pintura: ["realismo"]

    # Preferencias finales
    Preferencias:
      type: object
      required:
        - interesesArtisticos
        - generosMusical
        - estilosPintura
      properties:
        interesesArtisticos:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaInteres"
          description: Lista de intereses artísticos seleccionados.
          example: ["dibujo", "escultura"]
        generosMusical:
          type: array
          items:
            $ref: "#/components/schemas/GeneroMusical"
          description: Lista de géneros musicales seleccionados.
          example: ["rock", "pop"]
        estilosPintura:
          type: array
          items:
            $ref: "#/components/schemas/EstiloPintura"
          description: Lista de estilos de pintura seleccionados.
          example: ["realismo", "abstraccion"]

    # DTO para inicializar cuestionario (futura API)
    CuestionarioDTO:
      type: object
      required:
        - id
        - titulo
        - preguntas
      properties:
        id:
          type: string
          description: Identificador del cuestionario.
          example: "cuestionario_intereses_v1"
        titulo:
          type: string
          description: |
            Título del cuestionario.
            Ejemplo: Descubre tu feed personalizado.
          example: "Cuestionario de Intereses"
        eslogan:
          type: string
          description: Eslogan o texto de bienvenida breve.
          example: "Descubre inspiraciones artísticas acordes a tus gustos"
        preguntas:
          type: array
          items:
            $ref: "#/components/schemas/Pregunta"
          description: Lista de preguntas que componen el cuestionario.

    # DTO para enviar preferencias al feed (futura integración)
    PreferenciasDTO:
      type: object
      description: |
        Estructura que se envía desde el cuestionario hacia el módulo de feed.
        
        En futuras iteraciones, puede integrarse con API REST Java.
        
        Opciones de handoff:
        1. Memory object: Componente padre pasa como prop React.
        2. URL state: React Router navigate({ state: { preferencias } }).
        3. Query params: /feed?interesArtistico=dibujo&generoMusical=rock,...
        4. Redux/Context API: Store compartido.
        
        Recomendación MVP: Opción 1 (memory).
      allOf:
        - $ref: "#/components/schemas/Preferencias"
        - type: object
          properties:
            timestamp:
              type: string
              format: date-time
              description: Marca de tiempo de creación de preferencias.
              example: "2026-10-19T14:30:00Z"
            sessionId:
              type: string
              description: |
                ID de sesión (futuro).
                En MVP puede ser undefined.
              example: "sess_abc123"

    # Respuesta de validación
    RespuestaValidacion:
      type: object
      required:
        - valida
      properties:
        valida:
          type: boolean
          description: Si true, la respuesta es válida.
        errores:
          type: object
          description: |
            Mapa de errores por pregunta: { idPregunta -> mensaje de error }
          example:
            artistica: "Esta pregunta es obligatoria"
            musical: "Solo se permite una opción"

    # Estado del cuestionario (para persistencia futura)
    EstadoCuestionario:
      type: object
      description: |
        Estado completo del cuestionario.
        Útil para guardar en localStorage/sessionStorage en futuras iteraciones.
      properties:
        respuestas:
          $ref: "#/components/schemas/RespuestaCuestionario"
        iniciado_en:
          type: string
          format: date-time
          description: Marca de tiempo de inicio.
          example: "2026-10-19T14:00:00Z"
        modificado_en:
          type: string
          format: date-time
          description: Marca de tiempo de última modificación.
          example: "2026-10-19T14:30:00Z"

  # Ejemplos de respuestas (para documentación)
  examples:
    # Ejemplo 1: Cuestionario completo
    CuestionarioEjemplo:
      value:
        id: "cuestionario_intereses_v1"
        titulo: "Cuestionario de Intereses"
        eslogan: "Descubre inspiraciones artísticas acordes a tus gustos"
        preguntas:
          - id: "artistica"
            texto: "¿Cuáles son tus intereses artísticos?"
            permiteMultipleSelecciones: true
            obligatoria: true
            opciones:
              - id: "dibujo"
                categoria: "dibujo"
                descripcion: "Dibujo"
              - id: "escultura"
                categoria: "escultura"
                descripcion: "Escultura"
          - id: "musical"
            texto: "¿Cuáles son tus géneros musicales favoritos?"
            permiteMultipleSelecciones: true
            obligatoria: false
            opciones:
              - id: "rock"
                categoria: "rock"
                descripcion: "Rock"
              - id: "pop"
                categoria: "pop"
                descripcion: "Pop"

    # Ejemplo 2: Preferencias finales
    PreferenciasEjemplo:
      value:
        interesesArtisticos: ["dibujo", "escultura"]
        generosMusical: ["rock", "pop"]
        estilosPintura: ["realismo"]
        timestamp: "2026-10-19T14:30:00Z"

# ============================================================================
# FUTURAS INTEGRACIONES CON BACKEND
# ============================================================================
#
# Opción 1: Consumir cuestionario desde backend (futuro)
#   GET /api/v1/cuestionarios/{id}
#   Response: CuestionarioDTO
#   En MVP: Cuestionario es hardcoded en frontend (CuestionarioFactory)
#
# Opción 2: Guardar respuestas en backend (futuro)
#   POST /api/v1/respuestas-cuestionario
#   Request body: { respuestas: RespuestaCuestionario }
#   Response: { id: string, preferencias: Preferencias }
#   En MVP: Sin persistencia; respuestas en memoria
#
# Opción 3: Obtener publicaciones personalizadas (futuro, módulo feed)
#   POST /api/v1/feed/personalizado
#   Request body: { preferencias: Preferencias }
#   Response: { publicaciones: Publicacion[] }
#   En MVP: El feed es un stub; no obtiene publicaciones
#
# Versión: 1.0 | Completado: 2026-10-19
