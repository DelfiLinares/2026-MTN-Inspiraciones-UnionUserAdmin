openapi: 3.0.0

info:
  title: API de Recuperación de Contraseña — Módulo 008
  version: 1.0.0
  description: |
    **Especificación de referencia para futura integración backend**
    
    ⚠️  **ESTADO**: Documento de referencia NO implementado aún
    - No existe backend en esta fase
    - Endpoints son placeholders para planificación futura
    - Módulo 008 es 100% frontend (simulación local)
    - Esta spec se usará cuando se implemente backend en fases posteriores

  contact:
    name: Equipo de Desarrollo
    url: https://github.com/inspiraciones
  
  x-module: "008-inspiraciones-recuperacion-contrasena"
  x-phase: planning
  x-status: "reference-only"

servers:
  - url: https://api.inspiraciones.local/v1
    description: Servidor de referencia (futuro)
    x-environment: production
  
  - url: http://localhost:3000/api/v1
    description: Servidor local de desarrollo (futuro)
    x-environment: development

tags:
  - name: Recuperación
    description: Endpoints de recuperación de contraseña
    x-planned-for: "Fase posterior a módulo 008"

paths:
  /recuperacion/solicitar:
    post:
      summary: Solicitar recuperación de contraseña
      description: |
        Inicia el proceso de recuperación enviando correo electrónico.
        
        **Nota**: Actualmente NO implementado. Cuando se implemente:
        1. Recibir correo válido
        2. Validar que existe usuario con ese correo
        3. Generar token de recuperación
        4. Enviar email con enlace
        5. Retornar confirmación neutral (sin revelar si correo existe)
      
      tags:
        - Recuperación
      
      operationId: solicitarRecuperacion
      
      x-planned: true
      x-implementation-phase: "Posterior a módulo 008"
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacion'
            example:
              correo: "usuario@ejemplo.com"
      
      responses:
        '202':
          description: Solicitud aceptada (procesando)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecuperacion'
              example:
                exito: true
                mensaje: "Se ha enviado un enlace de recuperación a tu correo electrónico"
        
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: "validation_error"
                mensaje: "El correo electrónico es inválido"
                campo: "correo"
        
        '429':
          description: Demasiadas solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: "rate_limit"
                mensaje: "Demasiados intentos. Intenta más tarde."
        
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              example:
                error: "server_error"
                mensaje: "Error interno del servidor"

  /recuperacion/verificar/{token}:
    post:
      summary: Verificar token de recuperación
      description: |
        Valida token y permite cambiar contraseña.
        
        **Nota**: Futuro endpoint. Cuando se implemente:
        1. Recibir token desde enlace de email
        2. Validar que token es válido y no expiró
        3. Permitir cambio de contraseña
      
      tags:
        - Recuperación
      
      operationId: verificarToken
      x-planned: true
      
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Token de recuperación enviado por email
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasena'
      
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecuperacion'
        
        '400':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

components:
  schemas:
    SolicitudRecuperacion:
      type: object
      required:
        - correo
      properties:
        correo:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: usuario@ejemplo.com
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      x-domain-entity: "CorreoElectronico"
      x-validation: "RFC compliant + domain dot requirement"
    
    RespuestaRecuperacion:
      type: object
      required:
        - exito
        - mensaje
      properties:
        exito:
          type: boolean
          example: true
        mensaje:
          type: string
          description: Mensaje neutral (igual para todos los casos)
          example: "Se ha enviado un enlace de recuperación a tu correo electrónico"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-20T15:30:45.123Z"
      x-privacy-note: "Mensaje idéntico sin importar si correo existe"
    
    CambioContrasena:
      type: object
      required:
        - contrasena
        - confirmacion
      properties:
        contrasena:
          type: string
          format: password
          minLength: 8
          description: Nueva contraseña
        confirmacion:
          type: string
          format: password
          minLength: 8
          description: Confirmación de contraseña
      x-note: "Futuro: validaciones de fuerza, requisitos, etc."
    
    ErrorRespuesta:
      type: object
      required:
        - error
        - mensaje
      properties:
        error:
          type: string
          enum:
            - validation_error
            - rate_limit
            - token_invalid
            - token_expired
            - server_error
          description: Código de error
        mensaje:
          type: string
          description: Descripción del error
        campo:
          type: string
          description: Campo con error (si aplica)
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Futuro: Token JWT para operaciones autenticadas"

  x-domain-mapping:
    Email: "/components/schemas/SolicitudRecuperacion/properties/correo"
    EstadoFormularioRecuperacion: "State machine: solicitud → pendiente → exito/error"
    SolicitudRecuperacion: "/components/schemas/SolicitudRecuperacion"
    ValidadorCorreoElectronico: "schema.correo.pattern"

security: []
# Futuro: Agregar bearerAuth cuando backend esté listo

