  - "📱 Módulo 008 = Frontend simulado + local state"
  - "✅ Cuando backend esté listo, usar endpoints reales"

x-roadmap:
  phase-008-actual: "Frontend-only, simulación local (750ms setTimeout)"
  phase-009-o-posterior: "Backend integration, real API calls"
  considerations: "Rate limiting, token expiration, email delivery, security"
