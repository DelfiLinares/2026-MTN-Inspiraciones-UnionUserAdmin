openapi: 3.0.3
info:
  title: API Desafíos (contrato propuesto para el frontend 003)
  version: 0.1.0-borrador
  description: |
    Contrato que consumen las apps de usuario y de administración del módulo 003 Desafíos.

    - Derivado de `spec.md` y `constitution.md` v1.1.0 del módulo.
    - No implementa backend (constitution 003, principio 4). La API Java se integra en una iteración futura.
    - Los puntos no definidos se marcan con `x-pendiente` (ID de aclaración o de planificación). No se asumen valores.
    - Los listados usan paginación por cursor: `cursor` y `limite` como entrada, `items` y `siguienteCursor` como salida.
    - `ELIMINADO` no se expone: un desafío eliminado responde 404 (borrado lógico, A-01 y A-12).
    - `estado` de `Desafio` y `DesafioResumen` lo calcula la API. El frontend lo usa para filtros y lo muestra (research.md, sección 7).
  x-pendiente:
    - A-16 (zona horaria y día de fin inclusivo)
    - P-05 (mecanismo de sesión heredado de 002)

servers:
  - url: "{baseUrl}"
    description: URL base de la API Java. Pendiente de definir en la iteración de integración.
    variables:
      baseUrl:
        default: "https://pendiente-backend.invalid"
        description: Pendiente. No se fija una URL real en este contrato.

tags:
  - name: Ambitos
    description: Catálogo de ámbitos de los desafíos.
  - name: Desafios
    description: Publicación, consulta, edición y borrado lógico de desafíos.
  - name: Solicitudes
    description: Propuestas de desafío enviadas por usuarios.
  - name: Respuestas
    description: Respuestas de usuarios a un desafío activo.

security:
  - sesionUsuario: []

paths:
  /ambitos:
    get:
      tags: [Ambitos]
      operationId: listarAmbitos
      summary: Catálogo de ámbitos de desafíos
      description: Devuelve los ámbitos válidos para etiquetar un desafío (RF-17, CB-12).
      x-pendiente:
        - A-02 (lista cerrada del catálogo y quién lo administra)
      responses:
        "200":
          description: Catálogo de ámbitos.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                x-pendiente:
                  - A-02 (valores no definidos; no se incluyen ejemplos)
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /desafios:
    get:
      tags: [Desafios]
      operationId: listarDesafios
      summary: Listado de desafíos con filtros
      description: |
        Lista desafíos visibles (no eliminados), con nombre, foto principal, ámbitos, fechas y estado (HU-09, HU-10, RF-16, RF-17).
        Requiere sesión iniciada (RF-24, A-18).
      parameters:
        - $ref: "#/components/parameters/FiltroAmbito"
        - $ref: "#/components/parameters/FiltroEstado"
        - $ref: "#/components/parameters/FiltroFechaDesde"
        - $ref: "#/components/parameters/FiltroFechaHasta"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Página de desafíos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaDesafios"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"

    post:
      tags: [Desafios]
      operationId: publicarDesafio
      summary: Publicar un desafío completo (solo ADMIN)
      description: |
        Publica un desafío con nombre, descripción larga, 1 a 5 fotos JPEG o PNG, fechas y al menos un ámbito (HU-01, RF-01, RF-04, RF-20).
        Si el usuario no es ADMIN, la API responde 403 (RF-21).
      x-pendiente:
        - P-01 (transporte de las fotos: se propone multipart; no está definido en la spec)
        - A-11 (longitud mínima y máxima de nombre y descripción)
        - A-21 (si se permite publicar con fechas ya pasadas)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DesafioEscrituraMultipart"
      responses:
        "201":
          description: Desafío publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"

  /desafios/{desafioId}:
    parameters:
      - $ref: "#/components/parameters/DesafioId"
    get:
      tags: [Desafios]
      operationId: obtenerDesafio
      summary: Detalle de un desafío
      description: Devuelve fotos, descripción larga, ámbitos, fechas, estado y si tiene respuestas (HU-11, RF-18).
      responses:
        "200":
          description: Detalle del desafío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desafio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

    put:
      tags: [Desafios]
      operationId: editarDesafio
      summary: Editar un desafío (solo ADMIN)
      description: |
        Modifica los campos editables del desafío (HU-02, A-07). El frontend pide confirmación explícita si el desafío está ACTIVO o tiene respuestas (RF-22).
        La concurrencia se controla con `If-Match` (CB-02).
      x-pendiente:
        - P-01 (transporte de las fotos en la edición)
        - P-04 (mecanismo de concurrencia `version` / `If-Match`: propuesta, no definida en la spec)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DesafioEscrituraMultipart"
      responses:
        "200":
          description: Desafío editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoVersion"

    delete:
      tags: [Desafios]
      operationId: eliminarDesafio
      summary: Eliminar un desafío (borrado lógico, solo ADMIN)
      description: |
        Borrado lógico (`ELIMINADO`). El desafío deja de aparecer en listados y sus respuestas se conservan ocultas (HU-03, A-01, A-12, CB-13).
        El frontend pide confirmación explícita antes de llamar a este endpoint (RF-22).
      responses:
        "204":
          description: Desafío eliminado lógicamente.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /desafios/{desafioId}/respuestas:
    parameters:
      - $ref: "#/components/parameters/DesafioId"
    get:
      tags: [Respuestas]
      operationId: listarRespuestas
      summary: Respuestas de un desafío, paginadas
      description: Lista las respuestas de un desafío (HU-12, RF-15, CB-09).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Página de respuestas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRespuestas"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

    post:
      tags: [Respuestas]
      operationId: responderDesafio
      summary: Enviar la respuesta propia a un desafío (USER)
      description: |
        Crea la única respuesta del usuario en este desafío (HU-14, RF-12, A-10).
        Solo se acepta si el desafío está ACTIVO (A-05). Si ya existe una respuesta del mismo usuario, o el desafío no está ACTIVO, la API responde 409 con `codigo` que lo indica.
      x-pendiente:
        - A-19 (si un ADMIN también puede responder como usuario)
        - A-22 (formatos y tipos de contenido de la respuesta)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespuestaEscritura"
      responses:
        "201":
          description: Respuesta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDesafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"

  /respuestas/{respuestaId}:
    parameters:
      - $ref: "#/components/parameters/RespuestaId"
    put:
      tags: [Respuestas]
      operationId: editarRespuesta
      summary: Editar la propia respuesta (solo el autor)
      description: |
        Solo el autor puede editarla. Un ADMIN no edita respuestas ajenas (HU-15, RF-13, RF-14, CB-07).
        El frontend no ofrece esta acción a un ADMIN que no es autor.
      x-pendiente:
        - A-22 (formato del contenido)
        - P-02 (si se puede editar cuando el desafío ya no está ACTIVO)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespuestaEscritura"
      responses:
        "200":
          description: Respuesta editada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDesafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

    delete:
      tags: [Respuestas]
      operationId: eliminarRespuesta
      summary: Eliminar una respuesta (autor o ADMIN)
      description: |
        El autor borra su respuesta; un ADMIN borra cualquier respuesta sin editarla (HU-15, HU-16, RF-13, RF-14).
        El frontend pide confirmación antes de llamar a este endpoint (RF-22).
      x-pendiente:
        - P-02 (si se puede borrar cuando el desafío ya no está ACTIVO)
      responses:
        "204":
          description: Respuesta eliminada.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /solicitudes:
    get:
      tags: [Solicitudes]
      operationId: listarSolicitudes
      summary: Solicitudes de desafío, paginadas
      description: |
        Un USER recibe solo sus solicitudes (RF-10, HU-05). Un ADMIN recibe las de cualquier usuario (RF-09, HU-06).
        El filtrado por autor lo aplica la API según la sesión (RF-21).
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado de la solicitud.
          schema:
            $ref: "#/components/schemas/EstadoSolicitudDesafio"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          description: Página de solicitudes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaSolicitudes"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"

    post:
      tags: [Solicitudes]
      operationId: proponerSolicitud
      summary: Enviar una solicitud para proponer un desafío (USER)
      description: |
        Crea una solicitud en estado `PENDIENTE` con el autor asignado por la API (HU-04, RF-07, RF-08).
        Un doble envío no debe crear dos solicitudes (CB-04).
      x-pendiente:
        - A-08 (campos de la solicitud: no se definen en este contrato)
        - A-19 (si un ADMIN también puede enviar solicitudes)
        - A-20 (duplicados lógicos sin decidir; solo se trata el doble envío accidental, CB-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDesafioEscritura"
      responses:
        "201":
          description: Solicitud creada en estado PENDIENTE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudDesafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /solicitudes/{solicitudId}:
    parameters:
      - $ref: "#/components/parameters/SolicitudId"
    get:
      tags: [Solicitudes]
      operationId: obtenerSolicitud
      summary: Detalle de una solicitud
      description: Un USER solo puede ver las suyas; un ADMIN, cualquiera. Si el USER pide una ajena, la API responde 403 (RF-21). Regla de acceso a confirmar en la iteración de tareas.
      responses:
        "200":
          description: Solicitud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudDesafio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

    put:
      tags: [Solicitudes]
      operationId: editarSolicitud
      summary: Editar una solicitud (autor o ADMIN)
      description: |
        El autor edita la suya; un ADMIN edita cualquiera (HU-05, HU-07, RF-10, RF-11).
      x-pendiente:
        - A-08 (campos editables)
        - A-04 (si el autor puede editar una solicitud APROBADA o RECHAZADA; la API no debe aceptarlo hasta resolver el punto)
        - P-04 (concurrencia `If-Match`)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDesafioEscritura"
      responses:
        "200":
          description: Solicitud editada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudDesafio"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ConflictoVersion"

    delete:
      tags: [Solicitudes]
      operationId: eliminarSolicitud
      summary: Eliminar una solicitud (autor o ADMIN)
      description: |
        El frontend pide confirmación antes de llamar a este endpoint (RF-22).
        Si la solicitud fue eliminada mientras el ADMIN la aprobaba, la API responde 404 (CB-03).
      x-pendiente:
        - A-04 (solicitudes APROBADA o RECHAZADA)
      responses:
        "204":
          description: Solicitud eliminada.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /solicitudes/{solicitudId}/aprobar:
    parameters:
      - $ref: "#/components/parameters/SolicitudId"
    post:
      tags: [Solicitudes]
      operationId: aprobarSolicitud
      summary: Aprobar una solicitud pendiente (solo ADMIN)
      description: |
        Cambia el estado de `PENDIENTE` a `APROBADA` (HU-06, RF-09, A-03). Publicar el desafío es un paso aparte del admin.
        Si la solicitud ya no está `PENDIENTE`, la API responde 409 (CB-06).
      x-pendiente:
        - P-03 (efecto de aprobar sobre la publicación de un desafío: fuera de la spec, no se define aquí)
      responses:
        "200":
          description: Solicitud aprobada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudDesafio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"

  /solicitudes/{solicitudId}/rechazar:
    parameters:
      - $ref: "#/components/parameters/SolicitudId"
    post:
      tags: [Solicitudes]
      operationId: rechazarSolicitud
      summary: Rechazar una solicitud pendiente (solo ADMIN)
      description: |
        Cambia el estado de `PENDIENTE` a `RECHAZADA` (HU-06, RF-09). Si ya no está `PENDIENTE`, responde 409 (CB-06).
      x-pendiente:
        - A-17 (motivo de rechazo visible para el usuario y campo de motivo: sin decidir; no hay campo en el cuerpo)
      responses:
        "200":
          description: Solicitud rechazada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudDesafio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/PermisoDenegado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"

components:
  securitySchemes:
    sesionUsuario:
      type: http
      scheme: bearer
      x-pendiente:
        - P-05 (mecanismo de sesión: token o cookie; se hereda de 002 y debe confirmarse)

  parameters:
    DesafioId:
      name: desafioId
      in: path
      required: true
      schema:
        type: string
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema:
        type: string
    RespuestaId:
      name: respuestaId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto como `siguienteCursor`. Sin valor, empieza desde el inicio.
      schema:
        type: string
    Limite:
      name: limite
      in: query
      required: false
      description: Tamaño de página. Valor máximo pendiente de definir por el backend.
      schema:
        type: integer
        minimum: 1
        default: 20
      x-pendiente:
        - A-15 (volúmenes y tiempos objetivo)
    FiltroAmbito:
      name: ambito
      in: query
      required: false
      description: Uno o más ámbitos. Se repite el parámetro o se separa con comas (decisión de formato pendiente de backend).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      x-pendiente:
        - A-02 (valores válidos del catálogo)
    FiltroEstado:
      name: estado
      in: query
      required: false
      description: Uno o más estados derivados. `ELIMINADO` no se admite como filtro.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/EstadoDesafio"
    FiltroFechaDesde:
      name: fechaDesde
      in: query
      required: false
      description: Inicio del rango de fechas.
      schema:
        type: string
        format: date
      x-pendiente:
        - A-14 (filtro por fecha: forma del rango, HU-13 y RF-19)
    FiltroFechaHasta:
      name: fechaHasta
      in: query
      required: false
      description: Fin del rango de fechas.
      schema:
        type: string
        format: date
      x-pendiente:
        - A-14 (filtro por fecha: forma del rango, HU-13 y RF-19)
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Versión conocida del recurso. Si no coincide con la actual, la API responde 409.
      schema:
        type: string
      x-pendiente:
        - P-04 (mecanismo de concurrencia: propuesta, no definida en la spec)

  schemas:
    EstadoDesafio:
      type: string
      description: |
        Estado derivado de las fechas del desafío. `ELIMINADO` no se expone en la API.
      enum: [PROGRAMADO, ACTIVO, FINALIZADO]
      x-pendiente:
        - A-16 (frontera de ACTIVO: día de fin inclusivo o no)

    EstadoSolicitudDesafio:
      type: string
      enum: [PENDIENTE, APROBADA, RECHAZADA]

    Foto:
      type: object
      required: [id, url, formato, principal]
      properties:
        id:
          type: string
        url:
          type: string
          description: URL de lectura de la imagen. Forma de entrega pendiente de backend.
        formato:
          type: string
          enum: [JPEG, PNG]
        principal:
          type: boolean
          description: Foto que se muestra en el listado. Exactamente una por desafío.

    Ambitos:
      type: array
      minItems: 1
      items:
        type: string
      description: Al menos un ámbito. Solo se aceptan valores del catálogo.
      x-pendiente:
        - A-02

    DesafioEscrituraMultipart:
      type: object
      required: [datos, fotos]
      properties:
        datos:
          $ref: "#/components/schemas/DesafioEscritura"
        fotos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: binary
          description: Entre 1 y 5 imágenes JPEG o PNG (A-06). El tamaño lo valida el backend.
      x-pendiente:
        - P-01 (transporte de las fotos: multipart propuesto)

    DesafioEscritura:
      type: object
      required: [nombre, descripcionLarga, fechaInicio, fechaFin, ambitos]
      properties:
        nombre:
          type: string
          description: Obligatorio. Longitud pendiente de definir.
          x-pendiente:
            - A-11
        descripcionLarga:
          type: string
          description: Obligatoria. Longitud pendiente de definir.
          x-pendiente:
            - A-11
        fechaInicio:
          type: string
          format: date
          x-pendiente:
            - A-21 (fecha de inicio anterior a hoy)
        fechaFin:
          type: string
          format: date
          description: Debe ser posterior a fechaInicio (RF-03). La API valida esta regla.
          x-pendiente:
            - A-16 (día de fin inclusivo)
        ambitos:
          $ref: "#/components/schemas/Ambitos"

    Desafio:
      type: object
      required: [id, nombre, descripcionLarga, fotos, fechaInicio, fechaFin, ambitos, estado, tieneRespuestas, version]
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcionLarga:
          type: string
        fotos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/Foto"
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        ambitos:
          $ref: "#/components/schemas/Ambitos"
        estado:
          $ref: "#/components/schemas/EstadoDesafio"
        tieneRespuestas:
          type: boolean
          description: Indica si el desafío tiene respuestas. Se usa para pedir confirmación al editar (RF-22). Dato añadido al contrato porque la spec lo exige y no lo expresa.
        version:
          type: integer
          description: Versión para control de concurrencia.
          x-pendiente:
            - P-04

    DesafioResumen:
      type: object
      required: [id, nombre, fotoPrincipal, ambitos, fechaInicio, fechaFin, estado]
      properties:
        id:
          type: string
        nombre:
          type: string
        fotoPrincipal:
          $ref: "#/components/schemas/Foto"
        ambitos:
          $ref: "#/components/schemas/Ambitos"
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estado:
          $ref: "#/components/schemas/EstadoDesafio"

    PaginaDesafios:
      type: object
      required: [items, siguienteCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DesafioResumen"
        siguienteCursor:
          type: string
          nullable: true
          description: Nulo cuando no hay más páginas.

    SolicitudDesafioEscritura:
      type: object
      description: Campos de la solicitud. No definidos todavía.
      additionalProperties: true
      x-pendiente:
        - A-08 (campos de la solicitud no definidos)

    SolicitudDesafio:
      type: object
      required: [id, autorId, estado, version]
      properties:
        id:
          type: string
        autorId:
          type: string
        datos:
          type: object
          additionalProperties: true
          description: Datos propuestos por el usuario.
          x-pendiente:
            - A-08
        estado:
          $ref: "#/components/schemas/EstadoSolicitudDesafio"
        version:
          type: integer
          x-pendiente:
            - P-04

    PaginaSolicitudes:
      type: object
      required: [items, siguienteCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SolicitudDesafio"
        siguienteCursor:
          type: string
          nullable: true

    RespuestaEscritura:
      type: object
      required: [contenido]
      properties:
        contenido:
          description: Contenido de la respuesta. Tipo y formatos pendientes.
          x-pendiente:
            - A-22 (formatos: ¿los mismos que 002 (imagen, video, audio) o solo imagen? ¿aparecen en el feed de 002?)

    RespuestaDesafio:
      type: object
      required: [id, desafioId, autorId, contenido]
      properties:
        id:
          type: string
        desafioId:
          type: string
        autorId:
          type: string
          description: Permite a la UI decidir si muestra editar (solo autor) o borrar (autor o ADMIN).
        contenido:
          description: Contenido de la respuesta. Tipo pendiente.
          x-pendiente:
            - A-22

    PaginaRespuestas:
      type: object
      required: [items, siguienteCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RespuestaDesafio"
        siguienteCursor:
          type: string
          nullable: true

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: |
            Código estable para que la UI decida el mensaje. Valores propuestos (no definitivos):
            `VALIDACION`, `NO_AUTENTICADO`, `PERMISO_DENEGADO`, `NO_ENCONTRADO`, `CONFLICTO`, `CONFLICTO_VERSION`, `DESAFIO_NO_ACTIVO`, `RESPUESTA_DUPLICADA`, `TRANSICION_INVALIDA`.
        mensaje:
          type: string
          description: Mensaje comprensible para el usuario.
        campos:
          type: object
          additionalProperties:
            type: string
          description: Errores por campo para formularios (RNF-01).

  responses:
    ErrorValidacion:
      description: Datos inválidos. Incluye errores por campo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutenticado:
      description: Sesión ausente o expirada (CB-08).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermisoDenegado:
      description: El usuario no tiene permiso para esta acción (RF-21, CB-07).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: El recurso no existe o está eliminado (CB-01, CB-13).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflicto:
      description: Transición o estado no permitido (CB-06, DESAFIO_NO_ACTIVO, RESPUESTA_DUPLICADA).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConflictoVersion:
      description: La versión del recurso cambió desde que se leyó (CB-02).
      x-pendiente:
        - P-04
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
