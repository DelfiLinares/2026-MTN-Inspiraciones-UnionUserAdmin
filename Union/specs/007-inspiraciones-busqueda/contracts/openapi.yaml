openapi: 3.0.3
info:
  title: API de Búsqueda y Descubrimiento de Publicaciones (contrato para el backend futuro)
  version: 0.1.0
  description: |
    Contrato que deberá cumplir la API REST de Java. No se implementa en este repositorio.
    Solo lectura. Elementos marcados con `x-pending` dependen de ambigüedades de spec.md y NO están decididos.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /feed/fyp:
    get:
      operationId: obtenerFeedFyp
      summary: Página del feed "Para ti". El orden y contenido los decide la API.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Estilo'
        - $ref: '#/components/parameters/Tecnica'
        - $ref: '#/components/parameters/TipoArte'
        - $ref: '#/components/parameters/TipoContenido'
        - $ref: '#/components/parameters/Distancia'
      responses:
        '200': { $ref: '#/components/responses/Pagina' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }
  /publicaciones/busqueda:
    get:
      operationId: buscarPublicaciones
      summary: Resultados de búsqueda por texto y filtros.
      parameters:
        - name: q
          in: query
          required: true
          description: Texto ya normalizado por el cliente (2 a 100 caracteres). Alcance - título, descripción, tags y autor; decisión final de la API.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Estilo'
        - $ref: '#/components/parameters/Tecnica'
        - $ref: '#/components/parameters/TipoArte'
        - $ref: '#/components/parameters/TipoContenido'
        - $ref: '#/components/parameters/Distancia'
      responses:
        '200': { $ref: '#/components/responses/Pagina' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }
  /filtros/catalogo:
    get:
      operationId: obtenerCatalogoFiltros
      summary: Valores posibles de estilo, técnica y tipo de arte (catálogo dinámico).
      responses:
        '200':
          description: Catálogo de filtros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoFiltros' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-pending: "Mecanismo de autenticación a confirmar con el módulo general (puede ser cookie de sesión)."
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto por la página anterior. Ausente en la primera página.
      schema: { type: string }
    Limite:
      name: limite
      in: query
      required: false
      description: Tamaño de página. El cliente pide 20.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Estilo:
      name: estilo
      in: query
      description: Valores múltiples (OR dentro del filtro).
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    Tecnica:
      name: tecnica
      in: query
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    TipoArte:
      name: tipoArte
      in: query
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    TipoContenido:
      name: tipoContenido
      in: query
      schema:
        type: array
        items: { $ref: '#/components/schemas/TipoContenido' }
      style: form
      explode: true
    Distancia:
      name: distancia
      in: query
      description: |
        Radio máximo en km (5, 25 o 100). Solo se envía si el usuario concedió ubicación.
      schema: { type: integer, enum: [5, 25, 100] }
      x-pending: "A-02: cómo la API obtiene la ubicación lo decide el backend y aún no se sabe (lat/lng por petición o perfil). No inventado; el cliente no envía este parámetro hasta que se defina."
  responses:
    Pagina:
      description: Página de publicaciones en el orden definido por la API. Nunca incluye publicaciones ELIMINADA.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginaPublicaciones' }
    Error400:
      description: Parámetros inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: No autenticado. El cliente redirige a login. (x-pending A-16 - confirmar redirección vs. aviso)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: Sin permiso. El cliente muestra un aviso. (x-pending A-16)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error429:
      description: Demasiadas solicitudes.
      headers:
        Retry-After:
          description: Segundos de espera sugeridos (opcional, a confirmar).
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    TipoContenido:
      type: string
      enum: [IMAGEN, VIDEO, MUSICA, TUTORIAL]
    EstadoPublicacion:
      type: string
      enum: [ACTIVA, REPORTADA, ELIMINADA]
    PaginaPublicaciones:
      type: object
      required: [items, cursorSiguiente]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicacionResumen' }
        cursorSiguiente:
          type: string
          nullable: true
          description: Cursor opaco; null indica que no hay más resultados.
    PublicacionResumen:
      type: object
      required: [id, titulo, autor, miniaturaUrl, tipoContenido, estado]
      properties:
        id: { type: string }
        titulo: { type: string }
        autor:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string }
            nombre: { type: string }
        miniaturaUrl: { type: string, format: uri }
        tipoContenido: { $ref: '#/components/schemas/TipoContenido' }
        estado: { $ref: '#/components/schemas/EstadoPublicacion' }
        ancho:
          type: integer
          x-pending: "Opcional; dimensiones para reservar espacio. A definir con el backend."
        alto:
          type: integer
          x-pending: "Opcional; ver ancho."
      x-pending: "Campos exactos de la tarjeta confirmados en clarify A-14; los opcionales siguen pendientes."
    OpcionFiltro:
      type: object
      required: [valor, etiqueta]
      properties:
        valor: { type: string }
        etiqueta: { type: string }
    CatalogoFiltros:
      type: object
      required: [estilos, tecnicas, tiposArte]
      properties:
        estilos: { type: array, items: { $ref: '#/components/schemas/OpcionFiltro' } }
        tecnicas: { type: array, items: { $ref: '#/components/schemas/OpcionFiltro' } }
        tiposArte: { type: array, items: { $ref: '#/components/schemas/OpcionFiltro' } }
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        detalles:
          type: array
          items: { type: string }
