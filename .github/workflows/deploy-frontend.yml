name: Build frontend and deploy to Dokploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dokploy-dev
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Union/frontend
          file: ./Union/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_USE_MOCKS=${{ vars.VITE_USE_MOCKS || 'false' }}
            VITE_AUTH_GOOGLE_REDIRECT_URL=${{ vars.VITE_AUTH_GOOGLE_REDIRECT_URL }}
            VITE_AUTH_GITHUB_REDIRECT_URL=${{ vars.VITE_AUTH_GITHUB_REDIRECT_URL }}
            VITE_GEOLOCATION_ENABLED_DEFAULT=${{ vars.VITE_GEOLOCATION_ENABLED_DEFAULT || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request deployment in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail

          : "${DOKPLOY_URL:?Missing GitHub Actions secret: DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?Missing GitHub Actions secret: DOKPLOY_API_KEY}"
          : "${DOKPLOY_APPLICATION_ID:?Missing GitHub Actions secret: DOKPLOY_APPLICATION_ID}"

          if [[ "$DOKPLOY_URL" != https://* ]]; then
            echo "::error::DOKPLOY_URL must use HTTPS to protect the API key."
            exit 1
          fi

          payload=$(jq -n --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            '{applicationId: $applicationId}')

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload"

          echo "Deployment requested. Check its progress in Dokploy > Deployments."
